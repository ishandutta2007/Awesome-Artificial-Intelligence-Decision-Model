<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080c18"/><stop offset="45%" stop-color="#0f172a"/><stop offset="100%" stop-color="#040711"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#4f46e5" stop-opacity=".25"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".05"/></linearGradient><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatAlt{0%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes dashAnim{0%{stroke-dashoffset:0}}.text-pill,.text-subtitle,.text-title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.text-title{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.text-subtitle{font-weight:500;font-size:19px;fill:#94a3b8}.text-pill{font-weight:600;font-size:13px;fill:#e2e8f0}.anim-glow-1{transform-origin:200px 100px;animation:pulseGlow 8s ease-in-out infinite}.anim-glow-2{transform-origin:1000px 240px;animation:pulseGlow 10s ease-in-out infinite alternate}.anim-float-1{animation:floatSlow 6s ease-in-out infinite}.anim-float-2{animation:floatAlt 7s ease-in-out infinite}.anim-flow{stroke-dasharray:6 6;animation:dashAnim 3s linear infinite}</style></defs><rect width="1200" height="340" fill="url(#bgGrad)" rx="20"/><g class="anim-glow-1" opacity=".4"><circle cx="180" cy="90" r="140" fill="url(#glowGrad)" filter="url(#softGlow)"/></g><g class="anim-glow-2" opacity=".3"><circle cx="1020" cy="220" r="160" fill="url(#cyanGrad)" filter="url(#softGlow)"/></g><g stroke="#fff" stroke-width="1" opacity=".08"><path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300"/><path d="M 150,0 L 150,340 M 300,0 L 300,340 M 450,0 L 450,340 M 600,0 L 600,340 M 750,0 L 750,340 M 900,0 L 900,340 M 1050,0 L 1050,340"/></g><g class="anim-float-2" opacity=".4"><path fill="none" stroke="#6366f1" stroke-width="2" d="M 160 270 Q 280 295 400 270 T 640 270 T 880 270 T 1040 250" class="anim-flow"/><path fill="none" stroke="#06b6d4" stroke-width="1.5" d="M 120 250 Q 240 230 360 250 T 600 250 T 840 250 T 1080 270" class="anim-flow"/></g><rect width="1198" height="338" x="1" y="1" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity=".4" rx="19"/><g transform="translate(600, 52)"><rect width="280" height="32" x="-140" y="-16" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="16"/><circle cx="-115" cy="0" r="5" fill="#10b981"/><text x="-95" y="5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">DECISION INTELLIGENCE</text><text x="68" y="5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">2026</text></g><g text-anchor="middle"><text class="text-title" filter="url(#cardShadow)" transform="translate(600, 126)">Awesome AI Decision Models</text></g><g text-anchor="middle"><text class="text-subtitle" transform="translate(600, 172)">Business Rules • Causal Machine Learning • Autonomous Agent Decisioning</text></g><g class="anim-float-1"><g transform="translate(0, 0) translate(180, 230)"><rect width="180" height="42" x="0" y="0" fill="#1e293b" fill-opacity=".9" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)" rx="21"/><circle cx="24" cy="21" r="7" fill="#6366f1"/><text x="44" y="26" class="text-pill">Business Rules &amp; DMN</text></g><g transform="translate(0, 0) translate(390, 230)"><rect width="195" height="42" x="0" y="0" fill="#1e293b" fill-opacity=".9" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)" rx="21"/><circle cx="24" cy="21" r="7" fill="#8b5cf6"/><text x="44" y="26" class="text-pill">Causal ML &amp; Uplift</text></g><g transform="translate(0, 0) translate(615, 230)"><rect width="205" height="42" x="0" y="0" fill="#1e293b" fill-opacity=".9" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)" rx="21"/><circle cx="24" cy="21" r="7" fill="#ec4899"/><text x="44" y="26" class="text-pill">System 1 Agent Logic</text></g><g transform="translate(0, 0) translate(850, 230)"><rect width="170" height="42" x="0" y="0" fill="#1e293b" fill-opacity=".9" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)" rx="21"/><circle cx="24" cy="21" r="7" fill="#06b6d4"/><text x="44" y="26" class="text-pill">Enterprise &amp; OSS</text></g></g></svg>