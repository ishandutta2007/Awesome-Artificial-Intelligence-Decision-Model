<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .text-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .text-pill {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Subtle animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes dashAnim {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      
      .anim-glow-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 8s ease-in-out infinite;
      }
      .anim-glow-2 {
        transform-origin: 1000px 240px;
        animation: pulseGlow 10s ease-in-out infinite alternate;
      }
      .anim-float-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .anim-float-2 {
        animation: floatAlt 7s ease-in-out infinite;
      }
      .anim-flow {
        stroke-dasharray: 6 6;
        animation: dashAnim 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Animated Glow Spheres (Kept in distant background) -->
  <g class="anim-glow-1" opacity="0.4">
    <circle cx="180" cy="90" r="140" fill="url(#glowGrad)" filter="url(#softGlow)" />
  </g>
  <g class="anim-glow-2" opacity="0.3">
    <circle cx="1020" cy="220" r="160" fill="url(#cyanGrad)" filter="url(#softGlow)" />
  </g>

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,340 M 300,0 L 300,340 M 450,0 L 450,340 M 600,0 L 600,340 M 750,0 L 750,340 M 900,0 L 900,340 M 1050,0 L 1050,340" />
  </g>

  <!-- Animated Dynamic Decision Flow Elements (Lower background/sides) -->
  <g opacity="0.4" class="anim-float-2">
    <!-- Connecting flow lines with dynamic dash animation -->
    <path class="anim-flow" d="M 160 270 Q 280 295 400 270 T 640 270 T 880 270 T 1040 250" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="anim-flow" d="M 120 250 Q 240 230 360 250 T 600 250 T 840 250 T 1080 270" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Outer Neon Border Accent -->
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- TOP BRAND TAG -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="-115" cy="0" r="5" fill="#10b981" />
    <text x="-95" y="5" font-family="system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#38bdf8" letter-spacing="1.2">DECISION INTELLIGENCE</text>
    <text x="68" y="5" font-family="system-ui, sans-serif" font-weight="600" font-size="11.5" fill="#94a3b8">2026</text>
  </g>

  <!-- MAIN FOREGROUND TITLE (Crisp, High-Contrast & Foreground Positioned) -->
  <g transform="translate(600, 126)" text-anchor="middle">
    <text class="text-title" filter="url(#cardShadow)">Awesome AI Decision Models</text>
  </g>

  <!-- SUBTITLE (Clear and readable) -->
  <g transform="translate(600, 172)" text-anchor="middle">
    <text class="text-subtitle">Business Rules &#8226; Causal Machine Learning &#8226; Autonomous Agent Decisioning</text>
  </g>

  <!-- DYNAMIC INTERACTIVE-STYLE PILLS / METRIC CARDS (Foreground Bottom) -->
  <g class="anim-float-1" transform="translate(0, 0)">
    <!-- Pill 1: Business Rules & DMN -->
    <g transform="translate(180, 230)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="24" cy="21" r="7" fill="#6366f1" />
      <text x="44" y="26" class="text-pill">Business Rules &amp; DMN</text>
    </g>

    <!-- Pill 2: Causal Inference -->
    <g transform="translate(390, 230)">
      <rect x="0" y="0" width="195" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="24" cy="21" r="7" fill="#8b5cf6" />
      <text x="44" y="26" class="text-pill">Causal ML &amp; Uplift</text>
    </g>

    <!-- Pill 3: Agentic Decisioning -->
    <g transform="translate(615, 230)">
      <rect x="0" y="0" width="205" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="24" cy="21" r="7" fill="#ec4899" />
      <text x="44" y="26" class="text-pill">System 1 Agent Logic</text>
    </g>

    <!-- Pill 4: Open Source & Enterprise -->
    <g transform="translate(850, 230)">
      <rect x="0" y="0" width="170" height="42" rx="21" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" filter="url(#cardShadow)" />
      <circle cx="24" cy="21" r="7" fill="#06b6d4" />
      <text x="44" y="26" class="text-pill">Enterprise &amp; OSS</text>
    </g>
  </g>
</svg>
